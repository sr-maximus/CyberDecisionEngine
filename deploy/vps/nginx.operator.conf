# Reject cross-site browser requests even when HTTP Basic credentials are cached.
map $http_origin $cde_bad_origin {
  default 1;
  "" 0;
  "http://127.0.0.1:18080" 0;
  "http://localhost:18080" 0;
}
map $http_sec_fetch_site $cde_cross_site {
  default 0;
  "cross-site" 1;
}
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=per_client:10m;
server {
  listen 8080;
  server_name _;
  server_tokens off;
  if ($cde_bad_origin) { return 403; }
  if ($cde_cross_site) { return 403; }
  auth_basic "CyberDecisionEngine private operator";
  auth_basic_user_file /etc/nginx/operator.htpasswd;
  location = /healthz { auth_basic off; return 200 "ok\n"; }
  location = /operator-setup.html {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  limit_conn per_client 20;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  # Access is through an authenticated SSH tunnel, including reports and API.
  # This does not provide per-user or tenant authorization.
  location /api/ {
    limit_req zone=api_rate burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 930s;
  }
  location /reports/ {
    proxy_pass http://api:8000/reports/;
    proxy_read_timeout 930s;
    proxy_set_header Host $host;
  }
  location / { try_files $uri /index.html; }
}
