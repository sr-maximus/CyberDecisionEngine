# Add server-side HTTP authentication for the trusted private operator.
# Use together with compose.yml; never publish this profile on a public IP.
services:
  api:
    environment:
      CDE_DATABASE_USER: cde_app
  postgres:
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: cde_dbadmin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_password]
    volumes:
      - ./create-app-db.sh:/docker-entrypoint-initdb.d/10-create-app-db.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cde_dbadmin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    cap_add: !reset []
    ports: !override ["127.0.0.1:18080:8080"]
    tmpfs: !override
      - /var/cache/nginx:rw,nosuid,nodev,size=64m,mode=1777
      - /var/run:rw,nosuid,nodev,size=16m,mode=1777
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777
    volumes:
      - ./nginx.operator.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CDE_SECRET_DIR:?Set CDE_SECRET_DIR}/operator.htpasswd:/etc/nginx/operator.htpasswd:ro
      - ${CDE_SECRET_DIR:?Set CDE_SECRET_DIR}/operator-setup.html:/usr/share/nginx/html/operator-setup.html:ro
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

secrets:
  db_admin_password:
    file: ${CDE_SECRET_DIR:?Set CDE_SECRET_DIR}/db_admin_password
