# Private single-operator deployment. Never expose this API directly to the Internet.
name: cde-vps
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-security: &security
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyberdecisionengine
      POSTGRES_USER: cde
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [database]
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    logging: *logging
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cde -d cyberdecisionengine"]
      interval: 10s
      timeout: 5s
      retries: 10
  initialize:
    image: cde-vps-api:${CDE_RELEASE:-local}
    user: "0:0"
    restart: "no"
    network_mode: none
    entrypoint: [python, /app/scripts/vps_initialize.py]
    volumes:
      - runtime_data:/app/data
      - runtime_reports:/app/reports
      - ../../data:/seed:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    read_only: true
    logging: *logging
  api:
    <<: *security
    image: cde-vps-api:${CDE_RELEASE:-local}
    build: ../..
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m,mode=1777"]
    init: true
    entrypoint: [python, /app/scripts/vps_start_api.py]
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONDONTWRITEBYTECODE: "1"
      OPENCLAW_ENABLED: "false"
      OPENCTI_MODE: disabled
      OSINT_TOOLS_URL: ""
      KALI_SURFACE_URL: ""
      SPIDERFOOT_URL: ""
      TOR_SOCKS_PROXY_URL: ""
      EVIDENCE_CAPTURE_URL: ""
      CDE_REPORT_CONCURRENCY: "1"
    secrets: [db_password]
    volumes:
      - runtime_data:/app/data
      - runtime_reports:/app/reports
    networks: [database, application, outbound]
    depends_on:
      postgres: {condition: service_healthy}
      initialize: {condition: service_completed_successfully}
    mem_limit: 3g
    cpus: "2.0"
    pids_limit: 256
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
  web:
    <<: *security
    image: cde-vps-web:${CDE_RELEASE:-local}
    build: ../../web
    # Nginx starts as root to bind port 80 and then drops to its nginx worker.
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=64m
      - /var/run:rw,nosuid,nodev,size=16m
      - /tmp:rw,nosuid,nodev,size=32m
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:18080:80"]
    networks: [application, ingress]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
secrets:
  db_password:
    file: ${CDE_SECRET_DIR:?Set CDE_SECRET_DIR outside the checkout}/db_password
volumes:
  postgres_data:
  runtime_data:
  runtime_reports:
networks:
  database: {internal: true}
  application: {internal: true}
  outbound: {}
  ingress: {}
