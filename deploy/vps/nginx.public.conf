# Caddy on the host terminates TLS. Only loopback publishes this web container.
# Authentication, sessions and roles are enforced by the API in public mode.
limit_req_zone $http_x_forwarded_for zone=public_api:10m rate=10r/s;
limit_req_zone $http_x_forwarded_for zone=public_login:1m rate=5r/m;
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  location = /healthz { return 200 "ok\n"; }
  location = /operator-setup.html { return 404; }
  location = /api/auth/login {
    limit_req zone=public_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_read_timeout 30s;
  }
  location /api/ {
    limit_req zone=public_api burst=50 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_read_timeout 930s;
  }
  location /reports/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    # Imported report HTML is evidence, never a source of executable app code.
    add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'; img-src data: 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, no-store" always;
  }
  location / { try_files $uri /index.html; }
}
