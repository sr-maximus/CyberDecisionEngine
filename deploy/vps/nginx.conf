limit_req_zone $binary_remote_addr zone=api_rate:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=per_client:10m;
server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  limit_conn per_client 20;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  # Access is through an authenticated SSH tunnel, including reports and API.
  # This does not provide per-user or tenant authorization.
  location /api/ {
    limit_req zone=api_rate burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 930s;
  }
  location /reports/ {
    proxy_pass http://api:8000/reports/;
    proxy_read_timeout 930s;
    proxy_set_header Host $host;
  }
  location / { try_files $uri /index.html; }
}
