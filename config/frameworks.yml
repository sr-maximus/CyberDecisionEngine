frameworks:
  mitre_attack_enterprise:
    enabled: true
    stix_json: https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
    taxii: https://attack-taxii.mitre.org/api/v21/
  mitre_d3fend:
    enabled: true
    website: https://d3fend.mitre.org/
    mappings_json: https://d3fend.mitre.org/ontologies/d3fend-full-mappings.json
  mitre_atlas:
    enabled: true
    website: https://atlas.mitre.org/
  nist_csf_2:
    enabled: true
    reference: https://csrc.nist.gov/pubs/cswp/29/the-nist-cybersecurity-framework-csf-20/final
  iso_27001_2022:
    enabled: true
    note: Non-proprietary summary mappings only.
  soc2_tsc:
    enabled: true
    categories:
      - Security
      - Availability
      - Processing Integrity
      - Confidentiality
      - Privacy
