decision_rows:
  - risk_level: Bajo
    hr: "Registrar el resultado y mantener monitoreo periódico. No activar acciones disciplinarias."
    legal: "Sin intervención legal salvo solicitud de rectificación o exclusión."
    physical_security: "Sin acción adicional; verificar que no existan datos físicos sensibles."
    cybersecurity: "Mantener higiene digital y campañas generales de concientización."
    information_security: "Sin ajuste de privilegios; conservar evidencia mínima."
    risk_management: "Registrar en tablero de seguimiento preventivo."
    compliance: "Confirmar consentimiento y finalidad documentada."
    management: "No requiere escalamiento ejecutivo."
  - risk_level: Moderado
    hr: "Revisión manual con enfoque preventivo y registro de contexto."
    legal: "Validar legitimidad del tratamiento y posibles homónimos."
    physical_security: "Revisar exposición de ubicación si aplica."
    cybersecurity: "Recomendar cambio de contraseña, MFA y capacitación si hay señales técnicas."
    information_security: "Validar accesos según necesidad de saber."
    risk_management: "Actualizar matriz de riesgo individual y del área."
    compliance: "Documentar base de tratamiento y ventana de retención."
    management: "Informar solo si el área tiene exposición recurrente."
  - risk_level: Alto
    hr: "Convocar revisión por comité interno con debido proceso y trazabilidad."
    legal: "Evaluar implicaciones legales antes de cualquier medida laboral."
    physical_security: "Validar exposición de rutinas, direcciones o activos físicos."
    cybersecurity: "Ejecutar verificación de cuentas, credenciales, repositorios y accesos."
    information_security: "Revisar privilegios sensibles y segregación de funciones."
    risk_management: "Abrir plan de mitigación con responsables y fechas."
    compliance: "Revisar proporcionalidad, retención y derecho de rectificación."
    management: "Escalar a gerencia del área con hallazgos verificados."
  - risk_level: Crítico
    hr: "Activar comité formal; preservar imparcialidad y revisión humana."
    legal: "Acompañar investigación interna y controlar cadena de custodia documental."
    physical_security: "Evaluar medidas preventivas si hay exposición física creíble."
    cybersecurity: "Revisar sesiones, MFA, credenciales, endpoints y repositorios públicos."
    information_security: "Considerar reducción temporal y justificada de privilegios críticos."
    risk_management: "Clasificar como evento de riesgo y monitorear plan correctivo."
    compliance: "Asegurar minimización, confidencialidad y limitación de acceso al informe."
    management: "Informar a comité ejecutivo si el impacto corporativo es material."
  - risk_level: Extremo
    hr: "No actuar automáticamente; activar comité ejecutivo con debido proceso."
    legal: "Liderar preservación de evidencia y evaluación de obligaciones regulatorias."
    physical_security: "Coordinar protocolo de protección si hay amenaza física verificable."
    cybersecurity: "Ejecutar respuesta prioritaria: credenciales, accesos, repositorios y monitoreo."
    information_security: "Aplicar controles proporcionales sobre accesos privilegiados documentando justificación."
    risk_management: "Declarar riesgo extremo y activar plan de crisis si corresponde."
    compliance: "Restringir distribución del informe y habilitar mecanismo de rectificación."
    management: "Escalamiento ejecutivo completo y seguimiento hasta cierre formal."
